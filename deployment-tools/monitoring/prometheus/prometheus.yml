global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'livekit-linux'
    environment: 'production'

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'livekit'
    static_configs:
      - targets: ['livekit:6789']
        labels:
          service: 'livekit'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          service: 'promtail'
